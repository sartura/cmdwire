[package]
name = "cmdwire"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "A bounded, line-oriented command protocol"
repository = "https://github.com/sartura/cmdwire"
rust-version = "1.97"
publish = false

[features]
oracle = []

[[bin]]
name = "parser-oracle"
path = "src/bin/parser_oracle.rs"
required-features = ["oracle"]

[dependencies]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
